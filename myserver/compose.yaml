name: ${COMPOSE_PROJECT_NAME:-telesale_iic}

services:
  database:
    image: ${MYSQL_IMAGE:-mysql:5.7}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sale}
      MYSQL_USER: ${DB_USER:-telesale_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in myserver/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in myserver/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: myserver/backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TelesaleDb: "Server=database;Port=3306;Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD};SslMode=None;Allow User Variables=true;"
      RUN_DATABASE_INITIALIZER: ${RUN_DATABASE_INITIALIZER:-false}
      AI_PROVIDER: ${AI_PROVIDER:-Gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/chat/completions}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-15}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-300}
    volumes:
      - temp-imports:/app/TempImports
    networks:
      - app-network
      - egress-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: myserver/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - app-network
      - egress-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8890}:80"
      # - "${PHPMYADMIN_PORT:-8890}:80"
    networks:
      - app-network
      - egress-network
    depends_on:
      database:
        condition: service_healthy

networks:
  app-network:
    driver: bridge
    internal: true
  egress-network:
    driver: bridge

volumes:
  mysql-data:
  temp-imports:
